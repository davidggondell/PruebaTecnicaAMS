services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ams-frontend
    ports:
      - "5173:5173"
    environment:
      - CI=true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ams-backend
    ports:
      - "5000:5000"
    environment:
      - EXTERNAL_API_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
